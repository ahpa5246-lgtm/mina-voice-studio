name: Capture authentic README screenshots

on:
  push:
    branches: [docs/readme-real-screenshots-20261024]
    paths:
      - scripts/capture_readme_screenshots.py
      - .github/workflows/readme-screenshots.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI and Chromium
        run: |
          python -m pip install -r requirements-dev.txt 'playwright>=1.45,<2'
          python -m playwright install --with-deps chromium
      - name: Capture running FastAPI UI, without neural models or mockups
        run: python scripts/capture_readme_screenshots.py
      - name: Commit genuine screenshots into the documentation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/screenshots/*.png
          if git diff --cached --quiet; then
            echo 'No changes in generated screenshots.'
            exit 0
          fi
          git commit -m "docs: capture real Mina Voice Studio browser UI"
          git push origin HEAD:refs/heads/docs/readme-real-screenshots-20261024
