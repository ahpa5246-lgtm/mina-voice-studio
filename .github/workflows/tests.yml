name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q studio scripts tests
      - run: node --check studio/static/app.js
      - run: node --check studio/static/extras.js
      - run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and real headless browser runtime
        run: |
          python -m pip install -r requirements-dev.txt "playwright>=1.45,<2"
          python -m playwright install --with-deps chromium
      - name: Exercise UI and local API in Chromium
        run: python -m pytest tests/test_browser.py -q
