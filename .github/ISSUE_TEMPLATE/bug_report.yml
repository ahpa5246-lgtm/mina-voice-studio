name: Bug report
description: Report a reproducible UI, API, audio, or model-adapter defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not attach private speaker recordings, API keys, tokens, personal data or unlicensed model files.** Replace them with a short, licensed synthetic fixture where possible.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Cartoon Cast / episode export
        - Qwen VoiceDesign / clone / CustomVoice
        - Chatterbox speech
        - Applio / RVC
        - Transcription / SRT
        - Demucs / audio cleanup
        - Website / setup / other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Explain the actual behavior and why it is incorrect.
      placeholder: The app reports job completed but no WAV is available.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Exact steps to reproduce
      placeholder: |
        1. Start with ...
        2. Choose ...
        3. Run ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: OS, Python version, browser and GPU (if relevant)
      placeholder: Windows 10; Python 3.12; Chrome; RTX 3090 (optional)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error logs or screenshots (optional)
      description: Remove all private voice files, secrets, local full paths and personally identifying data.
  - type: checkboxes
    id: consent
    attributes:
      label: Checklist
      options:
        - label: I checked the README and existing issues for this problem.
          required: true
        - label: I have removed sensitive data and unlicensed recordings.
          required: true
